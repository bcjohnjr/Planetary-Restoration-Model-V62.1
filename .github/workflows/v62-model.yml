name: Planetary Restoration Model V62

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-v62:
    name: Run V62
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify flat V62 package
        run: |
          test -f planetary_restoration_model_v62.py
          test -f planetary_restoration_model_v59_1.py
          test -f requirements.txt
          test -f RUN_TESTS.sh
          echo "Flat V62 package structure verified."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V62 test suite
        run: |
          bash RUN_TESTS.sh

      - name: Run complete V62 model
        run: |
          python planetary_restoration_model_v62.py --tests

      - name: Show generated results
        run: |
          echo "Generated result files:"
          find results -maxdepth 2 -type f -print

      - name: Upload V62 results
        uses: actions/upload-artifact@v7
        with:
          name: Planetary-Restoration-V62-Results
          path: results/
          if-no-files-found: error
