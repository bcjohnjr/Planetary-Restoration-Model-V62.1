name: OSCAR External Validation V62

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_oscar_validation_v62.py'
      - 'external_validation_net_co2_trajectory.csv'
      - '.github/workflows/oscar-validation.yml'

permissions:
  contents: read

jobs:
  oscar-v3-3:
    name: OSCAR v3.3 paired validation
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout V62 repository
        uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Verify V62 validation inputs
        run: |
          test -f run_oscar_validation_v62.py
          test -f external_validation_net_co2_trajectory.csv
          python -m py_compile run_oscar_validation_v62.py

      - name: Install OSCAR v3.3 runtime dependencies
        run: |
          python -m pip install --upgrade 'pip<25'

          pip install \
            'numpy==1.23.3' \
            'scipy==1.9.3' \
            'pandas==1.5.3' \
            'xarray==0.20.1' \
            'matplotlib==3.7.5' \
            'netCDF4==1.6.5' \
            'h5netcdf==1.3.0' \
            'h5py==3.10.0'

      - name: Verify OSCAR Python dependencies
        run: |
          python - <<'PYDEP'
          import numpy
          import scipy
          import pandas
          import xarray
          import matplotlib
          import netCDF4
          import h5netcdf
          import h5py

          print("numpy:", numpy.__version__)
          print("scipy:", scipy.__version__)
          print("pandas:", pandas.__version__)
          print("xarray:", xarray.__version__)
          print("matplotlib:", matplotlib.__version__)
          print("netCDF4:", netCDF4.__version__)
          print("h5netcdf:", h5netcdf.__version__)
          print("h5py:", h5py.__version__)

          print("OSCAR Python dependencies verified.")
          PYDEP

      - name: Fetch pinned official OSCAR v3.3 source
        run: |
          rm -rf _oscar
          git clone https://github.com/tgasser/OSCAR.git _oscar
          cd _oscar
          git checkout 3ce008400e06363564e5981a35cbc32377d41d86
          test "$(git rev-parse HEAD)" = "3ce008400e06363564e5981a35cbc32377d41d86"
          echo "Pinned OSCAR source verified."

      - name: Verify OSCAR parameter files can be read
        run: |
          python - <<'PYNETCDF'
          import xarray as xr
          f = "_oscar/input_data/parameters/from_OSCARv2/ocean_CMIP5.nc"
          ds = xr.open_dataset(f)
          print(ds)
          ds.close()
          print("OSCAR NetCDF parameter file successfully opened.")
          PYNETCDF

      - name: Run paired OSCAR validation
        run: |
          python run_oscar_validation_v62.py \
            --oscar-root "$GITHUB_WORKSPACE/_oscar" \
            --trajectory external_validation_net_co2_trajectory.csv \
            --outdir oscar_results \
            --nmc 200 \
            --end-year 2300

      - name: Show OSCAR validation summary
        if: always()
        run: |
          if [ -f oscar_results/oscar_validation_summary.json ]; then
            cat oscar_results/oscar_validation_summary.json
          else
            echo "OSCAR validation summary was not generated."
          fi

      - name: List OSCAR result files
        if: always()
        run: |
          if [ -d oscar_results ]; then
            find oscar_results -maxdepth 2 -type f -print
          else
            echo "No oscar_results directory exists."
          fi

      - name: Upload OSCAR validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OSCAR-V62-External-Validation
          path: oscar_results/
          if-no-files-found: warn
